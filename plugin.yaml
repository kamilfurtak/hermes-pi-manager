name: pi-manager
version: "0.1.0"
description: "Hardened Hermes -> Pi RPC task manager. Replaces the synchronous pi --mode json --print --no-session adapter with a per-task RPC process, a durable SQLite task registry, a layered stall/crash watchdog, and session-identity-checked recovery after a manager restart. Semantic completion is gated on the real Pi agent_settled event only; verification is a separate step. Tools: pi_task, pi_status, pi_abort, pi_steer, pi_resume, pi_verify, pi_digest. No blocking wait by design. Notifications (bounded, rate-limited progress and terminal settled/failed/stalled/verifier notices) are durable outbox rows in the same registry, delivered by a plugin-owned worker that calls a plugin-local host adapter directly (it imports and directly calls the native tools.send_message_tool.send_message_tool) with bounded retry - at-least-once, never a private queue, an agent turn, or a send_message ToolRegistry entry. Standalone, opt-in via plugins.enabled."
kind: standalone

# Declared so `hermes plugins doctor` can check the manifest against what
# register() actually adds — a tool that appears at runtime but not here is
# exactly the drift the validator exists to catch.
provides_tools:
  - pi_task
  - pi_status
  - pi_digest
  - pi_abort
  - pi_steer
  - pi_resume
  - pi_verify

# No hooks: this plugin observes Pi through its own RPC transport, not
# through the agent's lifecycle events.
provides_hooks: []
